name: Instagram health check

# Manual diagnostic: checks whether the Instagram token/app can reach the API.
# Prints only API responses (never the token).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Instagram API
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          API=https://graph.instagram.com/v25.0
          q() { curl -s "$2" | sed "s/$IG_USER_ID/<IG_USER_ID>/g" | tr -d '\n' | cut -c1-600 > /tmp/r; echo "== $1"; cat /tmp/r; echo; echo "::notice title=$1::$(cat /tmp/r)"; }
          q me "$API/me?fields=user_id,username,account_type&access_token=$IG_ACCESS_TOKEN"
          q publishing_limit "$API/$IG_USER_ID/content_publishing_limit?fields=config,quota_usage&access_token=$IG_ACCESS_TOKEN"
          q recent_media "$API/$IG_USER_ID/media?fields=id,timestamp&limit=3&access_token=$IG_ACCESS_TOKEN"
